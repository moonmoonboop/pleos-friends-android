name: Pleos Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build and check Android app
        run: bash gradlew :app:testDemoDebugUnitTest :app:assembleDemoDebug :app:assembleConnectDebug :app:assembleDemoRelease :app:assembleDemoDebugAndroidTest :app:lintDemoDebug :app:lintConnectDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pleos-friends-apks
          path: |
            android/app/build/outputs/apk/**/debug/*.apk
            android/app/build/outputs/apk/demo/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
